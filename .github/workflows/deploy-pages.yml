name: Deploy frontend to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run automated tests
        run: npm test

      - name: Build static frontend
        run: npm run build
        env:
          CARELOOP_GITHUB_PAGES: "true"

      - name: Verify GitHub Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq 'src="/careloop/assets/index-[^"]+\.js"' dist/index.html
          grep -Eq 'href="/careloop/assets/index-[^"]+\.css"' dist/index.html
          grep -Rq --include='*.js' 'AI explanations are unavailable in this online demo' dist/assets

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static frontend
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
